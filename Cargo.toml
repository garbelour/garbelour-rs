[package]
name = "garbelour"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/garbelour-io/garbelour-rs"
readme = "README.md"
keywords = ["code-review", "github", "diff", "triage"]
description = "Classify PR diff hunks by reviewer attention: review, skim, or skip"

[lib]
name = "garbelour"
path = "src/lib.rs"

[[bin]]
name = "garbelour"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration/diff_test.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ureq = { version = "=3.3.0", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
ignore = "0.4"
toml = "0.8"
patch = "0.7"
globset = "0.4"

[profile.release]
lto = "thin"
